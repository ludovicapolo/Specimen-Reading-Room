            rec.urls.push(URL.createObjectURL(blob));
            scaricate++;
          }catch(e){}
        }
        if(rec.cover>=rec.files.length) rec.cover=0;
      }
    }
    state.records.sort((a,b)=>natural(a.id,b.id));
    render();
    let msg=pagine.length+(filtro?L(' pagine filtrate',' pages filtered'):L(' pagine lette',' pages read'))+'. '+
      nuovi+L(' record nuovi, ',' new records, ')+aggiornati+L(' aggiornati',' updated');
    if(conImmagini) msg+=', '+scaricate+L(' immagini scaricate',' images downloaded');
    if(senzaFoto) msg+='. '+senzaFoto+(senzaFoto===1?L(' pagina saltata perché senza foto',' page skipped: no photos')
      :L(' pagine saltate perché senza foto',' pages skipped: no photos'));
    toast(msg+'.');
  }catch(e){ toast(e.message) }
  finally{ b.disabled=false; b.textContent=L('Sincronizza','Sync') }
};

async function notionQuery(token,db,filtro,max){
  const out=[]; let cursor=null;
  const limite = max>0 ? max : Infinity;
  for(let i=0;i<40;i++){
    let res;
    try{
      const base = location.protocol.startsWith('http')
        ? '/notion/databases/' : 'https://api.notion.com/v1/databases/';
      res=await fetch(base+encodeURIComponent(db)+'/query',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'Notion-Version':'2022-06-28',
                 'Content-Type':'application/json'},
        body:JSON.stringify(Object.assign(
          {page_size: Math.min(100, limite===Infinity?100:limite-out.length)},
          cursor?{start_cursor:cursor}:{},
          filtro?{filter:filtro}:{}))
      });
    }catch(err){
      throw new Error(L('Notion non raggiungibile. Se hai aperto il file con doppio clic, '+
        'avvia il ponte locale: node proxy-notion.mjs, poi vai su localhost:8000. '+
        'In alternativa esporta il database in CSV e caricalo con Metadati.',
        'Notion not reachable. If you opened the file with a double click, start the local '+
        'bridge: node proxy-notion.mjs, then go to localhost:8000. Alternatively export the '+
        'database as CSV and load it with Metadata.'));
    }
    const data=await res.json();
    if(!res.ok) throw new Error('Notion: '+(data.message||res.status));
    out.push(...(data.results||[]));
    if(out.length>=limite){ out.length=limite; break }
    if(!data.has_more) break;
    cursor=data.next_cursor;
  }
  return out;
}
function flattenNotion(pg){
  const o={}; const props=pg.properties||{};
  Object.keys(props).forEach(k=>{
    const p=props[k]; let v='';
    switch(p.type){
      case 'title': o.__title=(p.title||[]).map(t=>t.plain_text).join(''); v=''; break;
      case 'rich_text': v=(p.rich_text||[]).map(t=>t.plain_text).join(''); break;
      case 'select': v=p.select?p.select.name:''; break;
      case 'multi_select': v=(p.multi_select||[]).map(x=>x.name).join('; '); break;
      case 'number': v=p.number==null?'':String(p.number); break;
      case 'checkbox': v=p.checkbox?'sì':'no'; break;
      case 'date': v=p.date?p.date.start:''; break;
      case 'url': v=p.url||''; break;
      case 'files':
        o.__files=(p.files||[]).map(f=>({
          name:f.name||'immagine',
          url:(f.file&&f.file.url)||(f.external&&f.external.url)||''
        })).filter(f=>f.url);
        v=''; break;
      default: v='';
    }
    if(v!=='') o[k]=v;
  });
  return o;
}

function exportCsv(){
  const cols=['record',L('colore dominante','dominant colour'),L('famiglia cromatica','colour family'),L('quota %','share %'),
    ...state.metaCols.map(mlabel),...PARAMS.map(plabel),L('tema','theme'),L('parole_chiave','keywords'),L('n_incertezze','n_uncertainties'),'n_run'];
  const lines=[cols];
  state.records.filter(r=>r.runs.length).forEach(r=>{
    const run=lastRun(r);
    const kw=((run.artefatto&&run.artefatto.parole_chiave)||[]).map(k=>k.originale).join('; ');
    lines.push([r.id,(r.colore&&r.colore.hex)||'',tcol((r.colore&&r.colore.famiglia)||''),
      (r.colore&&r.colore.quota)||'',...state.metaCols.map(c=>r.meta[c]||''),
      ...PARAMS.map(p=>fmt(valOf(r.corretta||run,p))),
      (run.artefatto&&run.artefatto.tema_dominante)||'', kw,
      (run.incertezze||[]).length, r.runs.length]);
  });
  const csv=lines.map(l=>l.map(c=>{
    const s=String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  download('specimen-reading-room.csv',csv,'text/csv');
}
function download(name,txt,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:mime}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* --- utilità ----------------------------------------------------- */
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
let toastTimer;
function toast(msg){
  let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.textContent=msg; clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.remove(),4200);
}

   la scheda Notion compare solo aprendo il file in locale o da localhost */

if(!IN_LOCALE) document.querySelector('.modes').classList.add('hidden');

const STATIC=[
  ['[data-view="scheda"]','Scheda','Record'], ['[data-view="corpus"]','Corpus','Corpus'],
  ['#btnDrawer','Impostazioni','Settings'], ['[data-mode="upload"]','Caricamento','Upload'],

  ['#nCredTog','Credenziali','Credentials'], ['#lblTok','Token di integrazione','Integration token'],
  ['#lblDb','ID del database','Database ID'], ['#lblWhere','Importa solo dove','Import only where'],
  ['#lblImg','Scarica anche le immagini','Also download images'], ['#btnNotion','Sincronizza','Sync'],
  ['#btnReload','ricarica','reload'], ['#drawerTitle','Impostazioni','Settings'],
  ['#btnDrawerClose','chiudi','close']
];
function applyStatic(){
  document.documentElement.lang=LANG;
  STATIC.forEach(([sel,it,en])=>{ const e=document.querySelector(sel); if(e) e.textContent=L(it,en) });
  document.getElementById('nNote').innerHTML=L('Crea i record dal database: il titolo della pagina '+
    'diventa l\'identificativo e le immagini del campo Foto la sequenza. Gli indirizzi di Notion '+
    'scadono dopo un\'ora, quindi le immagini vengono scaricate a ogni sessione. Richiede il '+
    'ponte locale <code>proxy-notion.mjs</code>.','Creates records from the database: the page '+
    'title becomes the identifier and the images in the Photo field the sequence. Notion links '+
    'expire after an hour, so images are downloaded at every session. Requires the local bridge '+
    '<code>proxy-notion.mjs</code>.');
  document.getElementById('nDb').placeholder=L('ID del database','Database ID');
  document.getElementById('btnLang').textContent = LANG==='en' ? 'IT' : 'EN';
  const ns=document.getElementById('nProp'); if(ns) ns.innerHTML='';   // si ricostruisce nella lingua giusta
}
document.getElementById('btnLang').onclick=()=>{
  LANG = LANG==='en' ? 'it' : 'en';
  try{ localStorage.setItem('srr:lang',LANG) }catch(e){}
  applyStatic(); render();
  if(document.getElementById('drawer').classList.contains('on')) renderDrawer();
  if(state.ingest==='notion') document.querySelector('.modes button[data-mode="notion"]').click();
};

applyStatic();
render();
